plugins { id 'com.android.application' }
android {
    namespace 'com.godofhanzi.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.godofhanzi.game'
        minSdk 28
        targetSdk 35
        versionCode (System.getenv('ANDROID_VERSION_CODE') ?: '1').toInteger()
        versionName System.getenv('ANDROID_VERSION_NAME') ?: '0.1.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('ANDROID_KEYSTORE') ?: '../release.jks')
            storePassword System.getenv('ANDROID_STORE_PASSWORD')
            keyAlias 'hanzi'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}

